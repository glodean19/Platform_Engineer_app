name: cicd

on:
  push:
    paths:
      - src/**
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Shorten commit id
        shell: bash
        run:
         echo "COMMIT_ID=${GITHUB_SHA::6}" >> "$GITHUB_ENV"
      -
        name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      -
        name: Build and push
        uses: docker/build-push-action@v7
        with:
          push: true
          tags: glodean19/platform_engineer_app:${{ env.COMMIT_ID}}
    outputs:
      commit_id:  ${{ env.COMMIT_ID}}
  cd:
    needs: ci
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install Python dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml  # Replace with your packages or: pip install -r requirements.txt

      - name: Modify values file
        shell: bash
        run: |
          python -c "
          import yaml
          with open('values.yaml', 'r') as f:
              data = yaml.safe_load(f)
          data['image']['tag'] = '${{ needs.ci.outputs.commit_id }}'
          with open('values.yaml', 'w') as f:
              yaml.safe_dump(data, f, default_flow_style=False)
          "

      - name: Install argocd
        shell: bash
        run: |
          curl -ksSL -o argocd https://argocd-server.argocd/download/argocd-linux-amd64
          chmod +x argocd
          sudo mv ./argocd /usr/local/bin/argocd

      - name: Argocd app sync
        shell: bash
        run: |
          argocd login argocd-server.argocd \
           --insecure \
           --grpc-web \
           --username admin \
           --password ${{ secrets.ARGOCD_PASSWORD }}
          argocd app sync pe-app
